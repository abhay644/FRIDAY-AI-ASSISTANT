<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - AI Assistant</title>
    <link rel="stylesheet" href="/static/css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .step { display: none; }
        .step.active { display: block; }
        .otp-inputs {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }
        .otp-field {
            width: 40px;
            height: 50px;
            text-align: center;
            font-size: 24px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        .otp-field:focus {
            border-color: var(--primary);
            outline: none;
        }
    </style>
</head>
<body>
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>

    <button id="themeToggle" class="theme-toggle" title="Toggle Theme">
        <i class="fas fa-moon"></i>
    </button>

    <div class="auth-container">
        <div class="logo">
            <i class="fas fa-key"></i>
            <h1>Account Recovery</h1>
        </div>
        
        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message" style="display:none; color: #10b981; background: rgba(16, 185, 129, 0.1); padding: 10px; border-radius: 8px; margin-bottom: 20px; text-align: center;"></div>

        <!-- Step 1: Identify -->
        <div id="step1" class="step active">
            <p class="subtitle">Enter your registered email or 10-digit mobile number</p>
            <form class="auth-form" id="identifyForm">
                <div class="input-group">
                    <label for="identifier">Email or Phone</label>
                    <input type="text" id="identifier" name="identifier" placeholder="email@example.com or 9876543210" required>
                </div>
                <button type="submit" class="btn-auth" id="sendOtpBtn">
                    <span>Send Verification Code</span>
                </button>
            </form>
        </div>

        <!-- Step 2: Verify -->
        <div id="step2" class="step">
            <p class="subtitle">Enter the code sent to <span id="targetIdentifier" style="font-weight: 600; color: var(--primary);"></span></p>
            <p style="font-size: 0.8rem; opacity: 0.7; margin-bottom: 10px;">The code will expire in 5 minutes</p>
            <form class="auth-form" id="verifyForm">
                <div class="otp-inputs" id="otpInputs">
                    <!-- Inputs generated by JS -->
                </div>
                <button type="submit" class="btn-auth" id="verifyOtpBtn">
                    <span>Verify Code</span>
                </button>
                <div style="text-align: center; margin-top: 15px;">
                    <a href="#" id="resendBtn" style="font-size: 0.9rem; color: var(--primary);">Resend Code</a>
                </div>
            </form>
        </div>

        <!-- Step 3: Reset -->
        <div id="step3" class="step">
            <p class="subtitle">Set your new password</p>
            <form class="auth-form" id="resetForm">
                <div class="input-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" name="newPassword" placeholder="Minimum 6 characters" required minlength="6">
                </div>
                <div class="input-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm new password" required>
                </div>
                <button type="submit" class="btn-auth" id="finishResetBtn">
                    <span>Update Password</span>
                </button>
            </form>
        </div>
        
        <div class="auth-footer">
            Remembered your password? <a href="/">Back to login</a>
        </div>
    </div>

    <script src="/static/js/theme.js"></script>
    <script src="/static/js/forgot-password.js"></script>
</body>
</html>
