<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Password - AI Assistant</title>
    <link rel="stylesheet" href="/static/css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="auth-container">
        <div class="logo">
            <i class="fas fa-lock"></i>
            <h1>Secure Your Account</h1>
        </div>
        
        <p class="subtitle">Please set a password for your new assistant account linked to <span id="userEmail" style="font-weight: 600; color: var(--primary);"></span></p>
        
        <div id="errorMessage" class="error-message"></div>
        
        <form class="auth-form" id="setPasswordForm">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" required>
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a strong password" required>
            </div>

            <div class="input-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required>
            </div>
            
            <button type="submit" class="btn-auth" id="submitBtn">
                <span>Finish Setup</span>
            </button>
        </form>
    </div>

    <script src="/static/js/set-password.js"></script>
</body>
</html>
